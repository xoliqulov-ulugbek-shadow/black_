<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phoenix Black Hole — WebGL</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#020106; }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  .hud {
    position:fixed; inset:22px 24px auto; display:flex; align-items:flex-start;
    justify-content:space-between; pointer-events:none; color:#f4e8e8;
    text-shadow:0 1px 14px #000; letter-spacing:.16em;
  }
  .brand { font-size:12px; font-weight:700; opacity:.9; }
  .sub { margin-top:7px; font-size:9px; letter-spacing:.25em; opacity:.48; }
  .controls { display:flex; gap:8px; pointer-events:auto; }
  button {
    border:1px solid #ffffff25; color:#f5e8e8; background:#100a17b8;
    padding:9px 12px; border-radius:999px; font-size:10px; letter-spacing:.12em;
    cursor:pointer; backdrop-filter:blur(12px); transition:.2s ease;
  }
  button:hover { border-color:#ff784eaa; background:#24101bdb; }
  .hint {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    color:#d8bfc8; opacity:.42; font-size:9px; letter-spacing:.2em;
    white-space:nowrap; pointer-events:none;
  }
  .error {
    position:fixed; inset:0; display:none; place-items:center; padding:30px;
    color:#fff; background:#08030b; text-align:center; line-height:1.6;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud">
  <div><div class="brand">PHOENIX // BLACK HOLE</div><div class="sub">GRAVITY ENGINE · LIVE SIMULATION</div></div>
  <div class="controls">
    <button id="pause">PAUSE</button>
    <button id="motion">MOTION: ON</button>
    <button id="full">FULLSCREEN</button>
  </div>
</div>
<div class="hint">MOVE YOUR POINTER TO DISTURB THE GRAVITY FIELD</div>
<div class="error" id="error">WebGL2 is unavailable in this browser.<br>Try the latest Chrome, Edge, or Firefox with hardware acceleration enabled.</div>
<script>
(() => {
  const canvas = document.getElementById('gl');
  const errorBox = document.getElementById('error');
  const gl = canvas.getContext('webgl2', { alpha:false, antialias:false, powerPreference:'high-performance' });
  if (!gl) { errorBox.style.display = 'grid'; return; }

  const vertex = `#version 300 es
  precision highp float;
  const vec2 P[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
  out vec2 vUv;
  void main(){ vec2 p=P[gl_VertexID]; vUv=p*.5+.5; gl_Position=vec4(p,0.,1.); }`;

  const fragment = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  in vec2 vUv;
  uniform vec2 uRes;
  uniform float uTime;
  uniform vec2 uMouse;
  uniform float uMotion;
  uniform float uEnergy;

  #define PI 3.14159265359
  float hash21(vec2 p){
    p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32);
    return fract(p.x*p.y);
  }
  float noise(vec2 p){
    vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),
               mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);
  }
  float fbm(vec2 p){
    float v=0., a=.5;
    for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(17.1,9.2); a*=.5; }
    return v;
  }
  vec3 palette(float x){
    vec3 a=vec3(.10,.015,.22), b=vec3(.95,.12,.025), c=vec3(1.0,.48,.10);
    vec3 d=vec3(.08,.48,.95);
    float r=smoothstep(0.,.48,x);
    vec3 warm=mix(a,b,r);
    warm=mix(warm,c,smoothstep(.38,.78,x));
    return mix(warm,d,smoothstep(.72,1.,x)*.62);
  }
  float lineGlow(float d,float w){ return w*w/(d*d+w*w); }

  void main(){
    vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
    float t=uTime*uMotion;
    vec2 mouse=(uMouse-.5)*vec2(uRes.x/uRes.y,1.);
    vec2 center=mouse*.10;
    vec2 p=uv-center;
    float r=length(p)+1e-5;
    float a=atan(p.y,p.x);

    // Gravitational lensing: bend the background around the event horizon.
    float bend=.105/(r+.075);
    vec2 lens=p*(1.+bend);
    float lr=length(lens);
    float la=atan(lens.y,lens.x);

    // Star field.
    vec2 starCell=floor(lens*vec2(115.,115.));
    float star=step(.9975,hash21(starCell))*smoothstep(1.2,.15,r);
    float twinkle=.55+.45*sin(t*2.1+hash21(starCell)*30.);
    vec3 col=vec3(.002,.001,.009)+star*twinkle*vec3(.45,.55,1.2)*.75;

    // Soft nebula behind the object.
    float neb=fbm(lens*4.+vec2(t*.018,-t*.012));
    col+=palette(fract(neb*.9+la*.08))*pow(neb,3.)*.045*smoothstep(1.3,.2,r);

    // Accretion disk: warped elliptical rings with turbulent plasma.
    float diskY=p.y + .055*sin(a*2.2+t*.7)*smoothstep(.15,.8,r);
    float diskR=length(vec2(p.x,diskY*2.15));
    float band=exp(-pow((diskR-.47)/.105,2.));
    float inner=exp(-pow((diskR-.30)/.035,2.));
    float turbulence=fbm(vec2(la*3.4+ t*.34, diskR*17.-t*.55));
    float streak=pow(max(0.,sin(la*13.-t*2.4+turbulence*5.)),8.);
    float heat=clamp(.24+turbulence*.65+streak*.55,0.,1.);
    float doppler=.48+.52*cos(a-.5);
    vec3 diskColor=mix(vec3(.10,.12,.95),palette(heat),.82);
    diskColor=mix(diskColor,vec3(1.,.73,.34),pow(doppler,5.)*.7);
    col+=diskColor*(band*.95+inner*.65)*doppler*uEnergy;

    // Thin bright rings and lensing rim.
    float photonRing=exp(-pow((r-.205)/.009,2.));
    float outerRing=exp(-pow((r-.57)/.014,2.));
    col+=photonRing*vec3(1.,.43,.16)*1.8*uEnergy;
    col+=outerRing*vec3(.22,.25,.95)*.34;

    // Absolute black event horizon.
    float horizon= smoothstep(.195,.205,r);
    col*=horizon;

    // Phoenix wings: paired sweeping, feather-like plasma streams.
    float wingMask=0.;
    vec3 wingCol=vec3(0.);
    for(int side=-1;side<=1;side+=2){
      float s=float(side);
      vec2 q=p;
      q.y*=s;
      float x=q.x;
      float curve=.13 + .46*pow(max(0.,x+.03),1.45);
      float featherWave=sin(x*27.-t*2.1+fbm(q*8.)*4.)*.018;
      float d=abs(q.y-curve-featherWave);
      float envelope=smoothstep(-.22,.03,x)*(1.-smoothstep(.42,.72,x));
      float core=lineGlow(d,.012)*envelope;
      float filaments=0.;
      for(int i=0;i<7;i++){
        float fi=float(i);
        float fx=x-fi*.012;
        float fy=.12+fi*.021+.40*pow(max(0.,fx),1.42);
        float fd=abs(q.y-fy-sin(fx*24.-t*2.8+fi)*.012);
        filaments+=lineGlow(fd,.0035)*envelope*(.55+fi*.055);
      }
      float sparks=noise(vec2(x*85.+t*3.,q.y*95.));
      wingMask+=core*.55+filaments*.12;
      vec3 wc=mix(vec3(.32,.025,.9),vec3(1.,.16,.025),clamp(x*1.6+.4,0.,1.));
      wc=mix(wc,vec3(.08,.55,1.),smoothstep(.25,.65,sparks)*.35);
      wingCol+=wc*(core*.7+filaments*.13);
    }
    col+=wingCol*uEnergy;

    // Infalling particles spiral toward the horizon.
    vec2 sp=p;
    float spiralA=a + 2.8*log(r+.035) - t*1.25;
    float particleField=0.;
    for(int i=0;i<4;i++){
      float fi=float(i);
      float phase=fract(spiralA/(2.*PI)+fi*.247);
      float radial=fract(r*5.2-fi*.19-t*(.10+fi*.012));
      float d=abs(phase-.5)*6.283;
      particleField+=exp(-d*d*18.)*exp(-pow((radial-.5)*5.,2.));
    }
    col+=palette(fract(spiralA*.16+.2))*particleField*.13*uEnergy;

    // Tiny debris sparks around the disk.
    vec2 debrisUV=vec2(la*18.+t*.8, lr*34.-t*1.3);
    float debris=pow(noise(debrisUV*vec2(7.,3.)),12.)*smoothstep(.9,.28,r);
    col+=debris*vec3(1.,.22,.035)*.8*uEnergy;

    // Mouse gravity ripple.
    float md=length(uv-mouse);
    float ripple=exp(-md*18.)*(.5+.5*sin(md*75.-t*5.));
    col+=ripple*vec3(.18,.08,.55)*.12;

    // Vignette and subtle film grain.
    float vignette=1.-smoothstep(.48,1.05,length(uv*vec2(1.,.92)));
    col*=.42+.58*vignette;
    float grain=hash21(gl_FragCoord.xy+fract(t)*100.)-.5;
    col+=grain*.012;
    col=pow(max(col,0.),vec3(.88));
    fragColor=vec4(col,1.);
  }`;

  function compile(type, source){
    const sh=gl.createShader(type); gl.shaderSource(sh,source); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  try {
    const program=gl.createProgram();
    gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));
    gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));
    gl.linkProgram(program);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
    const loc={
      res:gl.getUniformLocation(program,'uRes'),
      time:gl.getUniformLocation(program,'uTime'),
      mouse:gl.getUniformLocation(program,'uMouse'),
      motion:gl.getUniformLocation(program,'uMotion'),
      energy:gl.getUniformLocation(program,'uEnergy')
    };
    let width=0,height=0,dpr=1,elapsed=0,last=performance.now(),paused=false,motion=true;
    let mouseX=.5,mouseY=.5,targetX=.5,targetY=.5;
    function resize(){
      dpr=Math.min(devicePixelRatio||1,1.65);
      width=Math.floor(innerWidth*dpr); height=Math.floor(innerHeight*dpr);
      canvas.width=width; canvas.height=height; gl.viewport(0,0,width,height);
      gl.uniform2f(loc.res,width,height);
    }
    addEventListener('resize',resize); resize();
    addEventListener('pointermove',e=>{targetX=e.clientX/innerWidth;targetY=1-e.clientY/innerHeight;});
    document.getElementById('pause').onclick=()=>{
      paused=!paused; document.getElementById('pause').textContent=paused?'PLAY':'PAUSE';
    };
    document.getElementById('motion').onclick=()=>{
      motion=!motion; document.getElementById('motion').textContent='MOTION: '+(motion?'ON':'OFF');
    };
    document.getElementById('full').onclick=()=>{
      if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    };
    function frame(now){
      requestAnimationFrame(frame);
      const dt=Math.min((now-last)/1000,.04); last=now;
      if(!paused) elapsed+=dt;
      mouseX+=(targetX-mouseX)*.045; mouseY+=(targetY-mouseY)*.045;
      gl.uniform1f(loc.time,elapsed);
      gl.uniform2f(loc.mouse,mouseX,mouseY);
      gl.uniform1f(loc.motion,motion?1.:0.);
      gl.uniform1f(loc.energy,1.);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }
    requestAnimationFrame(frame);
  } catch(e) {
    errorBox.style.display='grid'; errorBox.innerHTML='Shader error:<br><small>'+String(e).replaceAll('<','&lt;')+'</small>';
  }
})();
</script>
</body>
</html>
